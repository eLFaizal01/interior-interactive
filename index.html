<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#237d79" />
    <meta name="description" content="Permainan menata ruangan untuk anak: tarik furnitur, lengkapi ruangan, dan kumpulkan bintang." />
    <link rel="icon" type="image/svg+xml" href="/assets/images/ui/icons/home.svg" />
    <title>Ayo Lengkapi Ruangan!</title>
  </head>
  <body>
    <main id="app">
      <section class="home-screen">
        <div class="home-copy">
          <div class="brand"><img src="/assets/images/ui/icons/home.svg" alt="" /> RUANG CERIA</div>
          <h1>Ayo Lengkapi<br /><span>Ruangan!</span></h1>
          <p>Tarik, pasang, dan buat ruangmu nyaman.</p>
          <div class="home-actions">
            <button class="button primary" data-mode="challenge"><img src="/assets/images/ui/icons/play.svg" alt="" />Main Tantangan</button>
            <button class="button secondary" data-mode="freeplay"><img src="/assets/images/ui/icons/infinity.svg" alt="" />Bermain Bebas</button>
          </div>
          <div class="home-note">Tiga ruangan kecil. Banyak cerita baru.</div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
